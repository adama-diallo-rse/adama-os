<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="480" height="480" role="img" aria-labelledby="titre desc">
<title id="titre">ADAMA OS, symbole Le Tissage animé</title>
<desc id="desc">Le symbole se dessine en traits de construction, prend matière, puis le sceau latérite se pose. Durée totale 1,1 seconde.</desc>
<style>
  .fond { fill: #182052; }
  .epure { fill: none; stroke: #f8f3ea; stroke-width: 0.35; opacity: 0.7; }
  .trace { stroke-dasharray: 160; stroke-dashoffset: 0; animation: trace 0.62s cubic-bezier(0.25, 1, 0.5, 1) both; }
  .t2 { animation-delay: 0.06s; }
  .t3 { animation-delay: 0.1s; }
  .t4 { animation-delay: 0.16s; }
  .pointille { animation: apparait 0.42s cubic-bezier(0.25, 1, 0.5, 1) 0.1s both; }
  .contour { fill: none; stroke: #f8f3ea; stroke-width: 0.6; }
  .contour-sceau { fill: none; stroke: #c85b32; stroke-width: 0.8; }
  .matiere { fill: #f8f3ea; clip-path: inset(0 0 0 0); animation: matiere 0.36s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
  .sceau { fill: #c85b32; transform-box: fill-box; transform-origin: 50% 50%; animation: sceau 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.88s both; }
  @keyframes trace { from { stroke-dashoffset: 160; } to { stroke-dashoffset: 0; } }
  @keyframes apparait { from { opacity: 0; } to { opacity: 1; } }
  @keyframes matiere { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes sceau { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .trace, .pointille, .matiere, .sceau { animation: none; }
  }
</style>
<rect class="fond" width="48" height="48"/>
<g class="epure">
  <path class="trace" d="M4 2.5h40M4 1.2v2.6M44 1.2v2.6M16 1.8v1.4M18 1.8v1.4M30 1.8v1.4M32 1.8v1.4"/>
  <path class="trace t2" d="M46 10v32M44.8 10h2.4M44.8 42h2.4M44.8 38h2.4"/>
  <path class="pointille" d="M10 4v40M24 4v40M38 4v40" stroke-dasharray="0.8 1.2"/>
  <circle class="pointille" cx="38" cy="15" r="6" stroke-dasharray="0.6 0.9"/>
  <path class="trace t3" d="M10 29L38 15"/>
</g>
<path class="contour trace t4" fill-rule="evenodd" d="M4 6h12v32h-12zM7 26v6h6v-6zM18 10h12v32h-12zM21 19v6h6v-6zM32 6h12v32h-12zM35 12v6h6v-6z"/>
<path class="contour-sceau trace t4" d="M35 12h6v6h-6z"/>
<path class="matiere" fill-rule="evenodd" d="M4 6h12v32h-12zM7 26v6h6v-6zM18 10h12v32h-12zM21 19v6h6v-6zM32 6h12v32h-12zM35 12v6h6v-6z"/>
<path class="sceau" d="M35 12h6v6h-6z"/>
</svg>
